{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto">
  <div class="card-body p-4 p-md-5">
    <h2 class="h3 mb-1">Welcome back</h2><p class="text-secondary mb-4">Log in to your local project.</p>
    <form method="post">
      <label class="form-label" for="email">Email</label>
      <input class="form-control mb-3" type="email" id="email" name="email" required>
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-4" type="password" id="password" name="password" required>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="small text-secondary mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
